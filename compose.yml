services:
  frontend:
    build: ./frontend
    ports:
      - '5000:5000'
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - '5001:5001'
    environment:
      - PORT=5001
    depends_on:
      - database

  # 3. Database Service (MySQL / MongoDB / PostgreSQL)
  database:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: K!tsun3kitsune
      MYSQL_DATABASE: crud_db
    ports:
      - '5002:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql